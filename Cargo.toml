[package]
name = "arena-example-bot"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The arena's Rust SDK, pinned to a commit so your module rebuilds the same.
arena-bot = { git = "https://github.com/collinjackson/libaw-arena", rev = "9aa63a4dde86cb5f46e51754ffa886aeb7de0b61" }

[profile.release]
opt-level = "s"
lto = true
